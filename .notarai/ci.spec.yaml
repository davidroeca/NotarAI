schema_version: '0.7'

intent: >
  GitHub Actions workflows, Dependabot configuration, and sampo-driven
  release automation for NotarAI. CI runs on every PR and push to main;
  docs are deployed to GitHub Pages on push; sampo prepares release PRs from
  changesets on main and publishes to GitHub Releases + crates.io when a
  release PR is merged. Dependabot keeps GitHub Actions and Cargo dependency
  versions current.

behaviors:
  - name: ci_on_push_and_pr
    given: 'a push to main or a pull request targeting main'
    then: 'the CI workflow runs three parallel jobs — fmt (cargo fmt --check), clippy (cargo clippy -- -D warnings), and test (cargo test, which implicitly builds); the test job requires fmt and clippy to pass first'

  - name: docs_deploy_on_push
    given: 'a push to main that touches any file under docs/ or notarai.spec.json'
    then: 'the docs workflow installs mdbook and mdbook-mermaid via cargo, builds the book, copies the mdBook output into public/docs/, adds a redirect at public/index.html, copies each schemas/<version>/spec.schema.json to public/schema/<version>/spec.schema.json (frozen snapshots for 0.5 and 0.6) and copies notarai.spec.json to public/schema/0.7/spec.schema.json, and deploys the public/ directory to GitHub Pages; only one deploy runs at a time (cancel-in-progress)'

  - name: init_sync_check
    given: 'the test job passes on a push to main or a PR targeting main'
    then: 'the init-sync job builds the release binary, runs notarai init, then checks git diff --exit-code .claude/skills/ to ensure the installed skills match the binary-embedded content; fails if any drift is detected'

  - name: release_prepare_on_main
    given: '.sampo/changesets/*.md files are merged to main'
    then: 'the release-pr workflow runs sampo release which consumes changesets, bumps versions in Cargo.toml, updates CHANGELOG.md, and opens (or updates) a release PR titled "Release v<version>"'

  - name: release_publish_on_merge
    given: 'a release PR (created by sampo release) is merged to main'
    then: 'the release workflow builds cross-platform binaries via a matrix of native runners (ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-latest, windows-latest) using `cargo build --release --target <triple>` for 7 targets (x86_64/aarch64 linux-gnu, x86_64/aarch64 linux-musl, x86_64/aarch64 macos, x86_64 windows-gnu), then runs sampo publish which creates a GitHub release with the binaries attached, creates a git tag, and publishes the notarai crate to crates.io'

  - name: dependabot_updates
    given: 'a new version of a GitHub Actions action, Cargo dependency, or npm dependency is available'
    then: 'Dependabot opens a PR to update the pinned version'

constraints:
  - 'Release binaries are built on a matrix of native runners (one per target triple), not via cargo-zigbuild'
  - 'Crates.io publish uses CARGO_REGISTRY_TOKEN secret'
  - 'Docs deployment targets the github-pages environment and requires pages write + id-token write permissions'
  - 'CI must pass cargo fmt, clippy, and all tests before merge'

invariants:
  - 'A release binary must never be published without a successful build and test run'

artifacts:
  configs:
    - path: '.github/workflows/ci.yml'
      role: 'CI workflow — build + test + fmt + clippy on push and PR'
    - path: '.github/workflows/docs.yml'
      role: 'Docs deploy workflow -- mdBook build + schema copy + GitHub Pages deploy on docs/ changes'
    - path: '.github/workflows/release-pr.yml'
      role: 'Release PR workflow -- runs sampo release on main to prepare a version-bump PR from changesets'
    - path: '.github/workflows/release.yml'
      role: 'Release workflow -- native matrix cross-compile + sampo publish (GitHub Releases + crates.io)'
    - path: '.github/workflows/dogfood-action.yml'
      role: 'Dogfood workflow -- builds notarai from source and runs the action comment flow on every PR'
    - path: '.github/dependabot.yml'
      role: 'Dependabot config for keeping GitHub Actions and Cargo dependency versions current'

decisions:
  - date: '2026-04-11'
    choice: 'Drift correction: release matrix uses native runners, not cargo-zigbuild'
    rationale: >
      The 2026-02-23 zigbuild decision below was reverted at some point without
      a corresponding spec update. The release workflow currently uses a matrix
      of native runners (ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-latest,
      windows-latest) with stock `cargo build --release --target <triple>`. This
      decision records the correction so the spec, the workflow, and the
      behaviors match.

  - date: '2026-04-11'
    choice: 'CI workflows operate on a Cargo workspace under crates/'
    rationale: >
      As part of the monorepo restructure, all cargo invocations target -p notarai
      (or pass --manifest-path crates/notarai/Cargo.toml when needed). The init-sync
      job runs the binary from the workspace target dir; .claude/skills/ stays at
      the repo root because Claude Code expects per-project (not per-crate) config.

  - date: '2026-02-23'
    choice: 'cargo-zigbuild for cross-compilation on ubuntu-latest (SUPERSEDED)'
    rationale: 'Originally chosen so all 7 targets could build on a single ubuntu-latest runner without native macOS/Windows runners. Reverted in favor of native matrix runners; see 2026-04-11 drift correction.'
  - date: '2026-02-23'
    choice: 'Dual distribution: GitHub Releases + crates.io'
    rationale: 'GitHub Releases provides direct binary downloads for users without Rust; crates.io serves Rust users who prefer cargo install'
  - date: '2026-02-26'
    choice: 'init-sync CI job to catch command drift'
    rationale: 'notarai init always overwrites .claude/commands/ from embedded binary content; the CI job verifies that the checked-in .claude/commands/ files match by running init and checking for a clean git diff'
  - date: '2026-02-26'
    choice: 'Migrate docs from Astro/Starlight to mdBook'
    rationale: 'mdBook is simpler and lighter -- no Node.js ecosystem, no build pipeline, no workspace dependencies. The CI docs job is now a single cargo install + mdbook build step instead of a multi-step npm/Astro pipeline'
  - date: '2026-03-08'
    choice: 'Migrate init-sync drift check from .claude/commands/ to .claude/skills/'
    rationale: 'Claude Code promotes .claude/skills/<name>/SKILL.md as the recommended location over .claude/commands/<name>.md; skills support additional capabilities including frontmatter, context: fork for subagents, and directory structure for supporting files'

  - date: '2026-04-12'
    choice: 'Adopted sampo for versioning, changelogs, and publishing'
    rationale: >
      sampo (changesets-for-polyglot-monorepos) replaces the manual GitHub release
      trigger with a changeset-driven flow: contributors drop .sampo/changesets/*.md
      files, sampo release consumes them into a release PR with version bumps and
      CHANGELOG updates, and sampo publish creates tags and pushes to crates.io.
      The CLI and action crates are linked so they version in lockstep. Short tags
      (v0.7.0) are used for the CLI crate since it is the primary artifact.
