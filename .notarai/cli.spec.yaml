schema_version: '0.8'

intent: >
  A CLI tool that validates NotarAI spec files against the JSON Schema
  and integrates with Claude Code via hooks so specs are automatically
  validated when written or edited. Distributed as a single static binary
  with no runtime dependencies, configured with a single `notarai init`
  command.

behaviors:
  - name: validate_single_file
    given: 'a path to a .spec.yaml file'
    then: 'validates it against the schema, prints PASS or FAIL with errors, exits 0 or 1'
    tested_by:
      - path: 'crates/notarai/tests/bin_test.rs'
        assertion: 'validates_single_spec_file'

  - name: validate_directory
    given: 'a path to a directory (or no args, defaulting to .notarai/)'
    then: 'recursively finds all .spec.yaml files, validates each; exits 1 if any fail; exits 0 with a stderr warning if no .spec.yaml files are found'
    tested_by:
      - path: 'crates/notarai/tests/bin_test.rs'
        assertion: 'validates_directory_recursively'

  - name: hook_validate_spec_file
    given: 'PostToolUse JSON on stdin with a file_path matching .notarai/**/*.spec.yaml'
    then: 'reads the file from disk, validates it, exits 1 with errors on stderr if invalid'

  - name: hook_ignore_non_spec
    given: 'PostToolUse JSON on stdin with a file_path that is not a spec file'
    then: 'exits 0 silently without validation'

  - name: hook_graceful_on_bad_input
    given: 'invalid JSON on stdin or a missing file'
    then: 'exits 0 silently without error'

  - name: init_agents_flag
    given: 'notarai init is invoked with --agents <list> (comma-separated)'
    then: >
      accepts any subset of claude, gemini, codex, opencode plus the meta-tokens "all"
      (expand to every known adapter) and "none" (install only agent-agnostic artifacts);
      unknown names cause a hard exit 1 listing valid options; deduplicates repeated names

  - name: init_agent_alias
    given: 'notarai init is invoked with the deprecated --agent flag'
    then: >
      prints a deprecation warning and forwards the value to --agents; "claude" maps to
      --agents claude; "generic" maps to --agents opencode (AGENTS.md + .opencode/skills
      with no pointer file and no hook)

  - name: init_interactive_prompt
    given: 'notarai init is invoked without --agents/--agent and stdin is a TTY'
    then: 'prompts on stderr for a comma-separated agent list; empty input defaults to claude'

  - name: init_autodetect
    given: 'notarai init is invoked without --agents/--agent and stdin is not a TTY'
    then: >
      auto-detects installed agents by scanning for pointer files (CLAUDE.md, GEMINI.md)
      and agent-root directories (.claude/, .gemini/, .codex/, .opencode/); installs for
      each detected adapter; falls back to claude if none are detected

  - name: init_always_installed_artifacts
    given: 'notarai init is invoked with any agent selection (including none)'
    then: >
      always writes .notarai/notarai.spec.json, .notarai/README.md (with the current CLI
      version), .notarai/reconcile-prompt.md, .notarai/bootstrap-prompt.md, .mcp.json
      (registering notarai mcp), and the .notarai/.cache/ line in .gitignore; always
      writes or section-merges AGENTS.md so user content outside the ## NotarAI section
      is preserved

  - name: init_per_adapter_install
    given: 'an agent adapter is selected'
    then: >
      for each selected adapter: (1) if the adapter declares a pointer file (CLAUDE.md,
      GEMINI.md), create it as a single-line `@AGENTS.md` stub when absent, leave
      unchanged when it already contains `@AGENTS.md`, or section-merge a `## NotarAI`
      block pointing at AGENTS.md when it exists with other content; (2) if the adapter
      declares a skills directory, always overwrite SKILL.md for notarai-reconcile and
      notarai-bootstrap, using Claude-flavor content for the claude adapter and
      generic-flavor content for gemini/codex/opencode; (3) if the adapter declares a
      hook installer, install it (only claude installs a PostToolUse hook in
      .claude/settings.json)

  - name: init_fail_fast
    given: 'init encounters an unparseable .claude/settings.json or .mcp.json, an unknown agent name, a pointer file that is a symlink, or a skills-dir path that is not a directory'
    then: 'exits 1 with a helpful error message; no partial-success silent warnings'

  - name: validate_warns_stale_schema
    given: 'notarai validate runs and .notarai/notarai.spec.json exists but its $id differs from the bundled schema'
    then: 'prints a warning telling the user to run `notarai init` to update; validation continues normally'

  - name: mcp_schema_staleness_note
    given: 'MCP server initializes and .notarai/notarai.spec.json exists but its $id differs from the bundled schema'
    then: 'includes a schemaNote field in the initialize response containing the local and bundled $id values and a suggestion to run `notarai init`; parallels validate_warns_stale_schema for MCP clients'

  - name: mcp_drift_score_on_init
    given: 'the MCP server initializes and at least one spec has a cached drift score'
    then: 'includes driftScore (0.0-1.0 weighted average), driftStatus (healthy/review/overdue), and mostDrifted (spec with highest score) fields in the initialize response; parallels the notarai score command for MCP clients'

  - name: init_idempotent
    given: 'notarai init has already been run'
    then: >
      detects existing hook and MCP entry and reports already configured; always
      overwrites agent-specific skills directories; always overwrites
      .notarai/notarai.spec.json, .notarai/README.md, .notarai/reconcile-prompt.md, and
      .notarai/bootstrap-prompt.md; section-merges AGENTS.md and pointer files
      (CLAUDE.md, GEMINI.md) idempotently; idempotently checks .gitignore and .mcp.json

  - name: init_replace_notarai_section
    given: "a markdown file (AGENTS.md, CLAUDE.md, GEMINI.md) already contains a '## NotarAI' heading"
    then: 'replaces the content between ## NotarAI and the next ## heading (or EOF) with the current template; user content outside the section is preserved'

  - name: schema_bump
    given: 'notarai schema-bump is invoked in a project with an older schema version'
    then: >
      detects the old version from .notarai/notarai.spec.json, overwrites it with the bundled
      schema, updates the schema_version field in all .notarai/*.spec.yaml files, validates all
      updated specs, and prints a summary; exits 0 on success, 1 on validation failure

  - name: schema_version_archive
    given: 'a developer bumps the schema version in notarai.spec.json'
    then: >
      before running schema-bump, the developer manually copies the current
      notarai.spec.json to crates/notarai/schemas/<old_version>/spec.schema.json to create
      a frozen snapshot for documentation; the docs workflow then copies each
      schemas/<version>/spec.schema.json to its corresponding public path, so every
      version URL serves the correct schema; notarai.spec.json always reflects the
      current (newest) version only

  - name: cache_status
    given: 'notarai cache status is invoked'
    then: 'prints the DB file path, the number of cached entries, and the newest entry timestamp; creates an empty DB if none exists'

  - name: cache_clear
    given: 'notarai cache clear is invoked'
    then: 'deletes .notarai/.cache/notarai.db and exits 0; no-op if the file does not exist'

  - name: mcp_cache_filtering
    given: 'get_spec_diff is called with bypass_cache unset or false'
    then: 'files whose BLAKE3 hash matches the cache are listed in the skipped field and excluded from the diff; a cold or absent cache diffs all governed files as a safe fallback'

  - name: mcp_spec_invalidation
    given: 'get_spec_diff or get_changed_artifacts is called and the governing spec (or a governed sub-spec) has changed on disk since the last cache update'
    then: 'cached artifact files that would normally be skipped are reclassified into a spec_invalidated array instead of skipped; when bypass_cache is true, spec_invalidated is always empty; get_changed_artifacts returns spec_invalidated alongside changed_artifacts'

  - name: mcp_spec_aware_splitting
    given: 'get_spec_diff is called and the diff includes .notarai/*.spec.yaml files'
    then: 'spec files are returned in a separate spec_changes field with full file content (not diff hunks); the system spec is always included in system_spec when any spec changed (with full content if it did not change, or just the path reference if it appears in spec_changes); the diff field contains only non-spec, non-binary artifact diffs'

  - name: mcp_binary_file_handling
    given: 'get_spec_diff is called and governed files include binary files (detected by extension: .png, .jpg, .pptx, .pdf, etc., or by "Binary files ... differ" in the git diff output)'
    then: 'binary files are excluded from diff and listed by path in binary_changes; file_categories maps each changed artifact file path to its artifact category from the spec (e.g. "code", "docs", "assets"); both fields are always present in the response'

  - name: mcp_server
    given: 'notarai mcp is invoked and JSON-RPC 2.0 messages are sent on stdin'
    then: 'responds to initialize with serverInfo and 6 tool definitions (list_affected_specs, get_spec_diff, get_changed_artifacts, mark_reconciled, clear_cache, snapshot_state); dispatches tools/call to the appropriate implementation; exits 0 on stdin EOF; get_spec_diff accepts an optional exclude_patterns array of glob strings passed as git :(exclude) pathspecs to suppress noisy files from the diff output; cache-filtering semantics are described by the mcp_cache_filtering behavior; spec-aware splitting semantics are described by the mcp_spec_aware_splitting behavior; binary file handling semantics are described by the mcp_binary_file_handling behavior; schema-staleness semantics are described by the mcp_schema_staleness_note behavior; spec-invalidation semantics are described by the mcp_spec_invalidation behavior'

  - name: state_show
    given: 'notarai state show is invoked'
    then: 'prints last reconciliation timestamp, git hash, branch, file count, and spec count; prints a message if no state file exists'

  - name: state_reset
    given: 'notarai state reset is invoked'
    then: 'deletes .notarai/reconciliation_state.json if it exists; no-op otherwise'

  - name: state_snapshot
    given: 'notarai state snapshot is invoked (or snapshot_state MCP tool is called)'
    then: 'reads all entries from the BLAKE3 cache, captures git HEAD and branch, writes .notarai/reconciliation_state.json with file_fingerprints, spec_fingerprints, and metadata including cli_version'

  - name: mcp_snapshot_state
    given: 'the snapshot_state MCP tool is called'
    then: 'snapshots cache + git state into reconciliation_state.json; returns summary with file/spec counts and git hash'

  - name: validate_v07_schema
    given: 'a spec file with schema_version 0.7 using any new optional block (compliance, feedback triggers, pipeline env/condition/on_failure/depends_on, design print/responsive/modes, content connections/duration/depends_on/evidence, state guard/action, variants_resolved) or extended enum values (domain: legal/education/infrastructure/research, output type: document/course/api/infrastructure/dataset/design-system/campaign/template, layout: paginated/canvas/timeline/tabbed, interaction trigger: schedule/external_signal/threshold/manual/lifecycle)'
    then: 'validates successfully; all new fields are optional and additive'

  - name: update_check
    given: 'notarai update --check is invoked'
    then: 'queries GitHub API for latest release, compares semver against current version, prints status (current version, latest version, whether update is available), exits 0'

  - name: update_install_github
    given: 'notarai update is invoked and install method is GithubRelease'
    then: 'downloads the platform-appropriate binary from GitHub Releases, atomically replaces the current executable, exits 0 on success or 1 on failure'

  - name: update_install_cargo
    given: 'notarai update is invoked and install method is CargoInstall'
    then: 'prints cargo install notarai instruction and exits 0'

  - name: update_install_dev
    given: 'notarai update is invoked and install method is DevBuild'
    then: 'prints cargo install --path . instruction and exits 0'

  - name: passive_update_hint
    given: 'notarai validate or notarai init completes'
    then: 'checks for updates using a global cache with 24h TTL and 5s timeout; if a newer version is available, prints a stderr hint; silently swallows all errors'

  - name: project_staleness_check
    given: 'notarai validate runs, or MCP server initializes, and .notarai/README.md exists with a version older than the running CLI (or is missing/unparseable)'
    then: 'prints a stderr hint (validate) or includes a projectNote field in the initialize response (MCP) suggesting notarai init to update project configs'

  - name: check_coverage_gaps
    given: 'notarai check is invoked in an initialized project'
    then: 'reports files tracked by git that are not governed by any spec artifact glob and not matched by the system spec exclude patterns; severity: warning'

  - name: check_orphaned_globs
    given: 'notarai check is invoked and a spec contains artifact globs'
    then: 'reports any artifact glob pattern that matches zero files on disk; severity: error (the spec references code that does not exist)'

  - name: check_changed_files
    given: 'notarai check is invoked and a BLAKE3 cache exists'
    then: 'reports governed files whose on-disk hash differs from the cache (changed since last reconciliation); severity: warning'

  - name: check_overlapping_coverage
    given: 'notarai check is invoked and multiple specs exist'
    then: 'reports files governed by two or more specs; severity: warning'

  - name: check_circular_refs
    given: 'notarai check is invoked and spec $ref chains under subsystems, applies, or dependencies form a cycle'
    then: 'reports the cycle (listing the spec paths on the cycle) as a single finding; severity: error'

  - name: check_behavior_completeness
    given: 'notarai check is invoked and a spec contains a behaviors array'
    then: 'reports any behavior missing a given or then field; severity: warning; one finding per missing field'

  - name: check_strict_mode
    given: 'notarai check is invoked with --strict'
    then: 'all warning-severity findings are promoted to error severity; exit code becomes 1 if any finding is present'

  - name: check_output_formats
    given: 'notarai check is invoked with --format human (default) or --format json'
    then: 'human format prints colored terminal output grouped by check type with a summary line counting errors and warnings; json format prints structured findings with type, severity, spec_path, file_path, and message fields'

  - name: check_exit_codes
    given: 'notarai check completes'
    then: 'exits 0 if no error-severity findings, 1 if any errors (including warnings promoted under --strict), 2 if .notarai/ does not exist'

  - name: check_base_branch_flag
    given: 'notarai check is invoked with --base-branch <branch>'
    then: 'accepts the flag for future changed-since-detection; currently unused (parameter is reserved but not wired to any check logic)'

  - name: export_context_single_spec
    given: 'notarai export-context --spec <path> --base-branch <branch>'
    then: 'outputs reconciliation context for that spec: spec content and changed files'

  - name: export_context_all_specs
    given: 'notarai export-context --all --base-branch <branch>'
    then: 'outputs context for all specs with affected artifacts, concatenated'

  - name: export_context_markdown
    given: '--format markdown (default)'
    then: >
      outputs the reconcile-prompt.md template with spec_name, spec_content, changed_files,
      and base_branch filled in; the template instructs the agent to read files and run
      git diff itself rather than embedding the full diff inline

  - name: export_context_json
    given: '--format json'
    then: 'outputs structured JSON with spec_path, spec_content, changed_files, diff, binary_changes, and file_categories; diff is included for consumers that cannot run git themselves'

  - name: export_context_bootstrap
    given: 'notarai export-context --bootstrap'
    then: >
      outputs the bootstrap-prompt.md template as-is (no placeholder substitution);
      warns on stderr if .notarai/ already contains spec files;
      does not require .notarai/ to exist (it is a pre-init command)

  - name: export_context_requires_git
    given: 'notarai export-context is invoked outside a git repository'
    then: 'exits 1 with an error message'

  - name: export_context_exit_codes
    given: 'notarai export-context completes'
    then: 'exits 0 on success, 1 on error, 2 if .notarai/ does not exist (except --bootstrap which does not require it)'

  - name: lint_runs
    given: 'notarai lint is invoked in an initialized project'
    then: 'runs all enabled lint rules (L001-L011) against every spec file in .notarai/; reports findings grouped by rule ID; exits 0 if no errors, 1 if any error-severity findings, 2 if .notarai/ does not exist'

  - name: lint_L001_no_behaviors
    given: 'a spec has tier full (default) and no behaviors array or an empty behaviors array'
    then: 'reports L001 error: Tier 1 spec has zero behaviors'

  - name: lint_L002_missing_given
    given: 'a behavior entry has no given field or an empty given string'
    then: 'reports L002 warning: Behavior missing given field'

  - name: lint_L003_missing_then
    given: 'a behavior entry has no then field or an empty then string'
    then: 'reports L003 warning: Behavior missing then field'

  - name: lint_L004_ref_missing
    given: 'a $ref target in subsystems, applies, or dependencies resolves to a path that does not exist on disk'
    then: 'reports L004 error: $ref target file does not exist'

  - name: lint_L005_circular_ref
    given: '$ref chains under subsystems, applies, or dependencies form a cycle'
    then: 'reports L005 warning: circular $ref dependency detected'

  - name: lint_L006_stale_decision
    given: 'a decision entry is older than the configured threshold (default 90 days) and has no rationale field'
    then: 'reports L006 warning: decision older than threshold with no rationale'

  - name: lint_L007_open_questions
    given: 'a spec has a non-empty open_questions array'
    then: 'reports L007 info: spec has open questions to resolve'

  - name: lint_L008_broad_glob
    given: 'an artifact glob pattern is exactly **/* (matches everything)'
    then: 'reports L008 warning: overly broad artifact glob'

  - name: lint_L009_schema_mismatch
    given: 'a spec schema_version does not match the bundled schema version'
    then: 'reports L009 error: schema version mismatch'

  - name: lint_L010_duplicate_behaviors
    given: 'two or more behaviors in the same spec have identical name fields'
    then: 'reports L010 warning: duplicate behavior names'

  - name: lint_L011_cross_cutting_as_subsystem
    given: 'a spec references a cross-cutting spec in its subsystems array instead of its applies array'
    then: 'reports L011 error: cross-cutting spec referenced in subsystems instead of applies'

  - name: lint_output_formats
    given: 'notarai lint is invoked with --format human (default) or --format json'
    then: 'human format prints colored output grouped by rule ID with a summary line; json format prints structured findings with rule_id, severity, spec_path, and message fields'

  - name: lint_config
    given: '.notarai/lint.yaml exists with per-rule overrides'
    then: 'rules can be disabled (enabled: false) or have severity overridden; rule-specific parameters (e.g. L006 decision_age_days) are configurable'

  - name: lint_integrated_into_check
    given: 'notarai check is invoked'
    then: 'lint rules are run alongside check rules; lint errors count as check errors; findings shared between lint and check (L002/L003 and BehaviorIncomplete, L005 and CircularRef, L011 and CrossCuttingAsSubsystem) are deduplicated'

  - name: severity_tiers
    given: 'notarai check produces findings'
    then: 'each finding is assigned a tier (critical, drift, or housekeeping); critical = behavioral/invariant violation or broken references; drift = code changed in ways that may not align with spec; housekeeping = documentation, style, or organizational misalignment'

  - name: severity_tier_assignment
    given: 'notarai check assigns tiers to check types'
    then: 'CircularRef, OrphanedGlob, TestPathMissing, and lint L004/L009/L011 are critical; ChangedSinceReconciliation and lint L001/L010 are drift; CoverageGap, OverlappingCoverage, BehaviorIncomplete, TestCoverageMissing, and lint L006/L007/L008 are housekeeping'

  - name: severity_tier_output_human
    given: 'notarai check --format human produces output with severity tiers'
    then: 'findings are grouped by tier (critical first, then drift, then housekeeping) with a tier header; within each tier, findings are grouped by check type'

  - name: severity_tier_output_json
    given: 'notarai check --format json produces output with severity tiers'
    then: 'each finding object includes a tier field with value critical, drift, or housekeeping'

  - name: check_config_file
    given: '.notarai/check.yaml exists with fail_on and warn_on settings'
    then: 'fail_on controls which tier causes exit code 1 (default: critical); warn_on controls which tier is shown (default: housekeeping); tiers below warn_on are suppressed from output'

  - name: check_config_default
    given: 'no .notarai/check.yaml exists'
    then: 'default behavior: fail on error-severity findings (existing behavior), show all tiers'

  - name: check_test_coverage_missing
    given: 'a tier-1 (full) spec with at least one artifacts.code entry has a behavior without a tested_by entry'
    then: >
      emits T001 (housekeeping, warning) naming the behavior and spec;
      suppressed for cross_cutting specs and for specs whose artifacts block
      declares no code entries (docs-only, config-only, or umbrella specs),
      since those govern artifacts that are not code-tested

  - name: check_test_path_missing
    given: 'a behavior lists a tested_by path that does not exist on disk'
    then: 'emits T002 (critical, error) naming the missing path'

  - name: score_command
    given: 'notarai score is invoked'
    then: 'computes a drift score (0.0-1.0) for each spec based on deterministic signals; outputs per-spec scores and an overall weighted average; exits 0 always (informational only)'

  - name: score_signals
    given: 'drift score is computed for a spec'
    then: 'uses 6 weighted signals: files changed since reconciliation (0.3), days since reconciliation (0.2), unresolved decisions (0.15), orphaned globs (0.15), open questions (0.1), unspecced files in governed directories (0.1); weights are configurable via .notarai/scoring.yaml'

  - name: score_thresholds
    given: 'a drift score is computed'
    then: 'scores map to status: 0.0-0.3 healthy (green), 0.3-0.6 review (yellow), 0.6-1.0 overdue (red)'

  - name: score_output_formats
    given: 'notarai score is invoked with --format human (default) or --format json'
    then: 'human format prints a colored table with spec, score, and status columns; json format prints structured output with specs array and overall object'

  - name: score_single_spec
    given: 'notarai score --spec <path> is invoked'
    then: 'computes and displays the score for only that spec'

  - name: decisions_list
    given: 'notarai decisions list is invoked'
    then: 'reads .notarai/decision-log.json and prints all decision proposals in a human-readable table; --status flag filters by proposed/accepted/rejected; exits 0 on success, 2 if .notarai/ does not exist'

  - name: decisions_accept
    given: 'notarai decisions accept <spec> <index> is invoked'
    then: 'removes the proposal at <index> from decision-log.json, appends { date, choice, rationale } to the spec YAML decisions array, validates the spec after modification, and prints confirmation; exits 0 on success, 1 on error'

  - name: decisions_reject
    given: 'notarai decisions reject <spec> <index> is invoked with optional --reason'
    then: 'marks the proposal at <index> as rejected in decision-log.json (with optional reason); does not modify the spec; exits 0 on success, 1 on error'

  - name: decisions_log_format
    given: 'decisions are proposed, accepted, or rejected'
    then: 'all proposals are stored in .notarai/decision-log.json as a JSON array; each entry has spec_path, date, choice, rationale, origin (reconciliation or human or bootstrap), status (proposed or accepted or rejected), and optional related_files and reject_reason'

  - name: reconcile_parallel_subagents
    given: 'the notarai-reconcile or notarai-bootstrap slash commands are invoked'
    then: >
      the orchestrating agent calls get_spec_diff per affected spec to gather all diffs
      upfront; for small changesets (<=10 changed files and <=500 diff lines total) it
      analyzes all specs inline; for larger changesets it spawns one sub-agent per
      affected spec in parallel using the Agent tool, passing pre-gathered diff data so
      sub-agents do not call get_spec_diff again; sub-agents call get_changed_artifacts,
      read their governed files, and return a structured report; the orchestrating agent
      collects all reports before producing the final reconciliation output

constraints:
  - 'Exit codes: 0 for success/no-op, 1 for validation failure or errors'
  - 'CLI uses clap 4.x derive API for argument parsing and help generation'
  - 'The jsonschema validator is compiled once at process init via OnceLock (not per call); runtime schema reads (e.g. freshness checks) are permitted'
  - 'All bundled assets (schema, templates, skills) are embedded at compile time via include_str!'
  - 'The crate README should contain valid links'
  - 'If certain files are linked in the crate README, they must be bundled with the crate'
  - 'Batch database operations -- loops over DB calls must use a single transaction with a prepared statement, not implicit per-call transactions'
  - 'Order by cost -- when a function tries multiple strategies, the cheapest must come first (e.g. check a known path before scanning a directory)'
  - 'Binary crate visibility -- pub means cross-module only (no external consumers); test-only helpers must be gated with #[cfg(test)]'
  - 'Avoid needless allocations -- prefer borrowing (&str, &Value) over .to_string() / .cloned() when the owned value is not needed'
  - 'Avoid .unwrap() in production code -- use ?, .expect("reason"), or combinators; .unwrap() is acceptable in #[test] functions and #[cfg(test)] modules'
  - 'Schema version enum must include all supported versions for backward compatibility (currently 0.8, 0.7, 0.6, and 0.5)'
  - 'Before bumping the schema version: manually copy notarai.spec.json to crates/notarai/schemas/<old_version>/spec.schema.json first; the docs workflow reads each version from its snapshot, not from notarai.spec.json'
  - 'Update checks use a global cache with 24h TTL; network requests use a 5s timeout for version checks and 120s for binary downloads'
  - 'The check command must never modify any files or the cache database'
  - 'The lint command must never modify any files'
  - 'Lint rule IDs (L001-L011) must be stable across versions (never renumber)'
  - 'notarai lint must complete in under 500ms for 20 specs'

invariants:
  - 'A valid spec file must never be reported as FAIL'
  - 'An invalid spec file must never be reported as PASS'
  - 'The hook must never block non-spec file writes (must exit 0)'

decisions:
  - date: '2026-02-20'
    choice: 'Reconcile command named notarai-reconcile.md'
    rationale: "Avoids colliding with a user's own /reconcile command"
  - date: '2026-02-23'
    choice: 'Rust over Node.js/TypeScript for the CLI'
    rationale: 'Single static binary with no runtime dependencies enables cross-platform distribution via direct download instead of requiring Node.js; project has not been released yet so this is a clean replacement'
  - date: '2026-02-23'
    choice: 'clap 4.x derive API for CLI parsing'
    rationale: 'Replaces raw process.argv; clap provides structured subcommands, auto-generated help text, and typed argument parsing with minimal boilerplate'
  - date: '2026-02-23'
    choice: 'include_str! for bundled assets instead of runtime file reads'
    rationale: 'Embeds schema, templates, and command files at compile time so the binary is fully self-contained with no adjacent file dependencies'
  - date: '2026-02-23'
    choice: 'assert_cmd + tempfile for integration tests'
    rationale: 'assert_cmd runs the compiled binary as a subprocess matching real usage; tempfile provides isolated directories for init tests'
  - date: '2026-02-24'
    choice: 'BLAKE3+SQLite hash cache for reconciliation context reduction'
    rationale: 'Hashing governed files and storing results in a local SQLite DB (.notarai/.cache/notarai.db) lets the reconcile command skip doc artifacts that have not changed since the last run, keeping context window usage proportional to actual change volume rather than the full repo'
  - date: '2026-02-24'
    choice: 'Synchronous JSON-RPC 2.0 over stdio for the MCP server (no tokio)'
    rationale: 'The MCP stdio transport is a simple request/response loop -- no async I/O is needed. Synchronous BufRead line-by-line is sufficient and avoids pulling in a tokio runtime'
  - date: '2026-02-24'
    choice: 'rusqlite bundled feature for SQLite'
    rationale: 'Compiles SQLite from source as part of the crate, keeping the binary fully self-contained without requiring a system libsqlite3'
  - date: '2026-02-25'
    choice: 'get_spec_diff filters governed files via hash cache before diffing'
    rationale: 'Files already reconciled (per mark_reconciled) are skipped; only files whose on-disk hash differs from the cache are passed to git diff, making response size proportional to what actually changed since the last reconcile run'
  - date: '2026-02-25'
    choice: 'clear_cache added as a 5th MCP tool alongside bypass_cache on get_spec_diff'
    rationale: 'Cache clearing was CLI-only; exposing it via MCP lets the reconcile command reset state without dropping to the shell; bypass_cache provides a per-call escape hatch without destroying the cache'
  - date: '2026-02-26'
    choice: 'Remove cache update and cache changed CLI subcommands'
    rationale: 'These subcommands were only used to seed the MCP cache from the CLI, but the correct way to seed the cache is via mark_reconciled (which uses relative paths as keys, matching how get_spec_diff queries it). The CLI subcommands used absolute paths as keys, creating a separate namespace. Removing them eliminates the confusion and reduces CLI surface.'
  - date: '2026-02-26'
    choice: 'init always overwrites .claude/commands/ and replaces the CLAUDE.md NotarAI section (superseded by 2026-03-08 decision)'
    rationale: 'Previous behavior skipped existing commands and warned on CLAUDE.md drift, requiring manual intervention to keep installed commands in sync with the bundled version. Always overwriting and always replacing makes init idempotent without user involvement -- the section is small and always correct after a run.'
  - date: '2026-02-26'
    choice: 'Move schema copy from .claude/notarai.spec.json to .notarai/notarai.spec.json'
    rationale: '.notarai/ is the natural home for NotarAI config; the old .claude/ path mixed project config with Claude-specific settings. The new location is more predictable and survives .claude/ resets. schema-bump also writes to .notarai/notarai.spec.json for consistency.'

  - date: '2026-03-04'
    choice: 'Reconciliation state as committed JSON file (Tier 3) separate from SQLite cache'
    rationale: >
      The SQLite cache tracks per-file hashes for within-session skip-unchanged
      optimization. The state file snapshots the cache at reconciliation time plus
      git context, enabling cross-run delta detection and shared baselines across
      collaborators. Using BTreeMap ensures deterministic output for clean diffs.

  - date: '2026-03-04'
    choice: 'Schema 0.6 consolidates all enhancement phases into a single bump'
    rationale: >
      Four design phases (output/content, interactions/states, design/audience/variants,
      pipeline/feedback) are all additive optional fields with the same implementation
      pattern. A single version bump avoids four near-identical release cycles.

  - date: '2026-03-04'
    choice: 'Versioned schema snapshots in schemas/<version>/spec.schema.json; notarai.spec.json is always current'
    rationale: >
      The docs site serves each schema version at its canonical $id URL
      (notarai.dev/schema/<version>/spec.schema.json). notarai.spec.json can only
      represent one version at a time, so old versions must be frozen as static
      snapshots in the repo. The schemas/ directory holds these snapshots; the docs
      workflow copies each independently. Pre-bump procedure: copy notarai.spec.json
      to schemas/<old_version>/spec.schema.json before editing it.

  - date: '2026-03-05'
    choice: 'ureq (blocking) for HTTP in update command'
    rationale: 'Project is sync throughout with no async runtime; ureq is a minimal blocking HTTP client that fits the existing architecture without pulling in tokio'

  - date: '2026-03-05'
    choice: 'Project staleness detected via .notarai/README.md header version'
    rationale: 'The README is already stamped with the CLI version at init time. Parsing the header is simpler than adding a new metadata file, and if parsing fails, suggesting notarai init is the correct recovery action anyway.'

  - date: '2026-03-05'
    choice: 'MCP get_spec_diff returns file_categories and binary_changes'
    rationale: >
      Non-software artifacts include binary files (images, PPTX, PDF) that
      produce unusable unified diffs. binary_changes lists them separately;
      file_categories maps each changed file to its spec artifact category
      for category-aware reconciliation.

  - date: '2026-04-03'
    choice: 'Init supports --agent claude|generic; claude is the default for backward compatibility'
    rationale: >
      Generic mode writes AGENTS.md and a reconcile prompt template instead of Claude-specific
      files (.claude/ hooks, skills, CLAUDE.md). MCP config is shared across both modes. Interactive
      prompt only when --agent is not provided and stdin is a TTY.

  - date: '2026-04-03'
    choice: 'export-context shares core logic with MCP tools via spec_loader and git modules, not via JSON-RPC'
    rationale: >
      Both export-context and MCP get_spec_diff need the same spec-loading, glob-expansion,
      and git-diff logic. Sharing via Rust modules avoids MCP JSON-RPC overhead and McpError
      wrapping while keeping a single source of truth for the reconciliation context assembly.

  - date: '2026-04-03'
    choice: 'notarai check is file/coverage analysis only; spec quality rules belong in a future notarai lint command'
    rationale: >
      Clean separation avoids overlap: check reports what files are drifted, unspecced,
      orphaned, or overlapping; lint (future) reports spec quality issues like missing
      behaviors, stale decisions, or invalid refs. check can optionally invoke lint later.

  - date: '2026-04-04'
    choice: 'reconcile-prompt.md is a lean template (no embedded diff); agents read files and run git diff themselves'
    rationale: >
      Embedding the full diff in the prompt scales badly for large changesets and is
      redundant for agents that have shell or file tool access. A lean template (spec +
      changed file list + instructions) keeps context small and lets tool-capable agents
      fetch exactly what they need. Agents without tool access should use --format json
      (which still includes the diff) or the MCP tools directly.

  - date: '2026-04-11'
    choice: 'notarai check promotes orphaned globs and circular $ref cycles to error severity; --strict promotes all warnings to errors'
    rationale: >
      Orphaned globs mean a spec references code that has been removed or relocated; leaving them
      as warnings let stale specs pass CI. Circular $ref cycles violate a system-spec invariant and
      must fail loudly. --strict gives CI operators a zero-tolerance switch without changing the
      default severity of informational findings like coverage gaps and overlapping coverage.

  - date: '2026-04-11'
    choice: 'notarai-reconcile skill delegates per-spec context assembly to notarai export-context'
    rationale: >
      Previously the skill duplicated MCP get_spec_diff orchestration in prose -- gathering
      diffs, splitting spec changes, formatting per-spec analysis prompts. All of that logic now
      lives in export-context (which renders the lean reconcile-prompt.md template per affected
      spec). The skill's job is reduced to: baseline selection, invoking export-context, fan-out
      decision, applies/dependencies handling, interactive resolution, and state snapshotting.
      Eliminates duplication and ensures the Claude Code path and the agent-agnostic path stay
      in lockstep automatically.

  - date: '2026-04-11'
    choice: 'CLI crate moved to crates/notarai/ as part of a Cargo workspace'
    rationale: >
      The repo is becoming a polyglot monorepo: the CLI crate, a forthcoming notarai-action
      crate, and any future tooling all ship from one repo with sampo (changesets-for-polyglot-monorepos)
      managing versioning. Moving the CLI under crates/notarai/ frees the workspace root for the
      virtual workspace manifest and sibling crates without renaming or republishing the package.
      All include_str! / include_bytes! paths still resolve crate-relative, so the move is purely
      structural -- no code changes were required inside src/ beyond the file relocation.

  - date: '2026-04-11'
    choice: 'Behavior completeness lives inside notarai check, not a future notarai lint'
    rationale: >
      Missing given/then fields are a deterministic, file-local structural signal -- exactly the
      kind of thing check already reports. Deferring it to a hypothetical lint subsystem would
      delay actionable feedback with no design benefit. When lint lands, it can absorb this rule
      or leave it in place; the rule ID will be stable either way.

  - date: '2026-04-13'
    choice: 'Remove T003 (mtime-based test staleness) from notarai check'
    rationale: >
      T003 compared test file mtime against governed code mtime to flag potentially stale tests.
      Filesystem timestamps cannot distinguish a test written before its code (standard TDD) from
      a test that genuinely has not been updated since the code changed -- any TDD workflow
      produces a false positive by design. A reliable replacement would need to use the hash cache
      to determine whether code changed after the last reconciliation, which is a more complex
      design. Removed for now; the ChangedSinceReconciliation check already surfaces drifted code
      files. T003 may be re-introduced with a cache-backed implementation.
    related_files:
      - 'crates/notarai/src/core/check.rs'
      - 'crates/notarai/src/commands/check.rs'
      - 'crates/notarai/tests/check_test.rs'

  - date: '2026-04-04'
    choice: 'export-context --bootstrap outputs bootstrap-prompt.md for generic agents; does not require .notarai/'
    rationale: >
      Generic agents need an equivalent of the Claude-specific notarai-bootstrap skill.
      The bootstrap prompt is a standalone template the agent can receive via any channel;
      it guides the agent through project discovery, structured interview, and spec drafting.
      Since bootstrapping is a pre-init operation, requiring .notarai/ would be circular.

  - date: '2026-03-08'
    choice: 'Migrate bundled Claude Code commands to skills (.claude/skills/<name>/SKILL.md)'
    rationale: >
      Claude Code promotes .claude/skills/ over .claude/commands/ as the recommended
      location; skills support frontmatter, context: fork for subagents, and directory
      structure for supporting files. No active users so no migration shim needed.
      The CLAUDE.md NotarAI section was also changed from @-imports of README and schema
      to an inline workflow description to avoid loading irrelevant content into every session.

  - date: '2026-04-13'
    choice: 'AGENTS.md as canonical context + agent adapter registry (claude, gemini, codex, opencode)'
    rationale: >
      The binary --agent claude|generic switch treated non-Claude agents as second class:
      AGENTS.md was overwritten wholesale, no bootstrap skill shipped for generic agents,
      and .claude/ was only touched for Claude. The ecosystem has converged on shared
      standards: AGENTS.md is read natively by opencode and codex, while CLAUDE.md and
      GEMINI.md both support `@AGENTS.md` imports. AGENTS.md now holds the canonical
      NotarAI context (section-merged, not overwritten). Each known agent becomes a row in
      a static adapter table (pointer_file, skills_dir, install_hook, skill_flavor);
      adding a new agent is a one-struct change. --agents takes a comma-separated list
      plus "all"/"none"; --agent is kept as a deprecated alias (claude->claude,
      generic->opencode). Init fails fast on unparseable JSON, unknown agents, unexpected
      symlinks, and non-directory skills paths rather than warning silently. Breaking
      change accepted: prior --agent generic runs that produced a user-edited AGENTS.md
      will now section-merge on re-run rather than full-overwrite.
    related_files:
      - 'crates/notarai/src/commands/init.rs'
      - 'crates/notarai/src/main.rs'
      - 'crates/notarai/skills-generic/notarai-reconcile/SKILL.md'
      - 'crates/notarai/skills-generic/notarai-bootstrap/SKILL.md'
      - 'crates/notarai/templates/agents.md'
      - 'crates/notarai/tests/init_test.rs'

artifacts:
  code:
    - path: 'crates/notarai/src/main.rs'
      role: 'CLI entry point -- clap definition and command dispatch'
    - path: 'crates/notarai/src/commands/*.rs'
      role: 'Command implementations (validate, init, hook_validate, cache, mcp, schema_bump, state, update)'
    - path: 'crates/notarai/src/core/*.rs'
      role: 'Core library (schema embedding, YAML parsing, jsonschema validation, hash cache, MCP tool implementations, update logic)'
  configs:
    - path: 'crates/notarai/Cargo.toml'
      role: 'Rust package manifest for the notarai CLI crate -- dependencies, build metadata, and binary target'
    - path: 'crates/notarai/README.md'
      role: 'Crate-level README shipped with the published crate; mirrors the project README at the workspace root so cargo publish has the readme inside the crate directory'
    - path: 'crates/notarai/notarai.spec.json'
      role: 'JSON Schema for the current schema version; always reflects the newest version; embedded into the binary via include_str!'
    - path: 'crates/notarai/schemas/*/spec.schema.json'
      role: 'Frozen snapshots of old schema versions; copied by the docs workflow to serve each version at its canonical $id URL'
    - path: 'crates/notarai/skills/notarai-reconcile/SKILL.md'
      role: 'Claude-flavor reconcile skill (uses Claude-specific tool names); installed into .claude/skills/ for the claude adapter'
    - path: 'crates/notarai/skills/notarai-bootstrap/SKILL.md'
      role: 'Claude-flavor bootstrap skill (uses Claude-specific tool names); installed into .claude/skills/ for the claude adapter'
    - path: 'crates/notarai/skills-generic/notarai-reconcile/SKILL.md'
      role: 'Tool-agnostic reconcile skill installed into .gemini/skills, .codex/skills, .opencode/skills for their respective adapters'
    - path: 'crates/notarai/skills-generic/notarai-bootstrap/SKILL.md'
      role: 'Tool-agnostic bootstrap skill installed into .gemini/skills, .codex/skills, .opencode/skills for their respective adapters'
    - path: 'crates/notarai/templates/notarai-readme.md'
      role: 'Bundled .notarai/README.md template written by notarai init to target projects'
    - path: 'crates/notarai/templates/agents.md'
      role: 'Bundled ## NotarAI section injected into AGENTS.md by notarai init (section-merged, not overwritten)'
    - path: 'crates/notarai/templates/reconcile-prompt.md'
      role: 'Bundled lean reconciliation prompt template; includes spec and changed files but not the diff'
    - path: 'crates/notarai/templates/bootstrap-prompt.md'
      role: 'Bundled agent-agnostic bootstrap prompt; written to .notarai/bootstrap-prompt.md by init and output by export-context --bootstrap'
  tests:
    - path: 'crates/notarai/tests/**/*.rs'
      role: 'Integration tests (assert_cmd CLI tests, tempdir-based init tests)'
